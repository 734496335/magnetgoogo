services:
  travel:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    container_name: travel-fare-monitor
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - ../../secrets/alert.env
    environment:
      MAGNET_WECHAT_SPOOL_DIR: "/var/lib/travel-fare-monitor/wechat-outbox"
      MAGNET_WECHAT_TTL_SECONDS: "1800"
      TRAVEL_DISABLE_FLYAI: "1"
      TRAVEL_DISABLE_GOOGLE_FLI: "1"
      TRAVEL_KIWI_MCP_URL: "https://mcp.kiwi.com"
      TRAVEL_TRUST_PROXY: "1"
      TRAVEL_HTTPS_ONLY: "1"
      TRAVEL_DEPLOYMENT_NAME: "Oracle生产"
      TRAVEL_CONFIG_PATH: "/var/lib/travel-fare-monitor/config.yaml"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../../state:/var/lib/travel-fare-monitor
      - ../../backups:/var/backups/travel-fare-monitor
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/status', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
