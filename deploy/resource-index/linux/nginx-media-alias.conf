# BEGIN MAGNETGOOGO MEDIA AUTO
location = /media/v1/current.json {
    alias /var/lib/magnet-media/public/v1/current.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
}

location ~ ^/media/v1/releases/([^/]+)/manifest\.json$ {
    alias /var/lib/magnet-media/public/v1/releases/$1/manifest.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
}

location ^~ /media/v1/objects/ {
    alias /var/lib/magnet-media/public/v1/objects/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /media/v1/covers/ {
    alias /var/lib/magnet-media/public/v1/covers/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /media/staging/ {
    deny all;
}
# END MAGNETGOOGO MEDIA AUTO
