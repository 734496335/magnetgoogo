server {
    listen 80;
    server_name cn.magnetgoogo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cn.magnetgoogo.com;

    ssl_certificate /etc/letsencrypt/live/cn.magnetgoogo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cn.magnetgoogo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/magnetgoogo-site;
    index index.html;

    location /download/ {
        alias /var/www/apk/;
        add_header Content-Disposition "attachment";
        add_header Content-Type application/vnd.android.package-archive;
    }

    location = /sources.enc.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=900";
    }

    location ~* \.(css|js|png|jpg|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Analytics Dashboard
    location /analytics/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
